[package]
name = "tabnas-lsp"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Semantic tokens from the tabnas engine's lex trace: the Rust half of the tabnas language server pipeline"
repository = "https://github.com/tabnas/lsp"

[lib]
name = "tabnas_lsp"
path = "src/lib.rs"

[dependencies]
# The engine is consumed as a SIBLING CHECKOUT, the standard tabnas
# development model: clone https://github.com/tabnas/parser next to this
# repo. The `tabnas` crate is not published, so there is no registry
# version to fall back on.
tabnas = { path = "../../parser/rs" }
# The registry (ts/data/registry.json, embedded) and the conformance
# fixtures (test/fixtures/*.json) are read with serde.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
