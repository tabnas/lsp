# Target: tabnas/lsp -> .github/workflows/ci.yml
#
# Standalone rather than a polyglot-ci.yml caller: the repo follows the
# ts/ + go/ fleet layout but the TS half ships plain CommonJS with no
# build step, and the Go half needs a go.work over the sibling engine
# checkout rather than a released module.
#
# All three jobs clone the parser as a sibling and use it at main: the
# ts/ package's `file:../../parser/ts` devDependency, go/'s `make
# test-go` go.work and rs/'s `path = "../../parser/rs"` dependency all
# resolve that layout. That is the point — this repo tracks engine
# contract work that may be unreleased.
#
# Action refs use version tags for readability; Renovate
# (helpers:pinGitHubActionDigests) pins them to commit SHAs automatically.

name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Use LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: lsp

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.x"

      - name: Clone the engine
        shell: bash
        run: git clone --depth 1 https://github.com/tabnas/parser.git parser

      - name: Build the engine
        shell: bash
        working-directory: parser/ts
        run: npm i && npm run build

      - name: Install
        shell: bash
        working-directory: lsp/ts
        run: npm i

      # The suite includes the generator end-to-end tests, which RUN a
      # generated Node server against a scripted LSP session and — when
      # allowed — compile and run a generated Go server and a generated
      # Rust server too. Those two cases are explicitly suppressed here
      # rather than left to a toolchain probe: hosted runner images ship
      # SOME Go and SOME Rust, so a probe would silently run them against
      # unpinned runner-image versions. ci-go owns the Go coverage,
      # pinned to 1.24; ci-rust owns the Rust coverage, pinned to the
      # MSRV.
      - name: Test
        shell: bash
        working-directory: lsp/ts
        env:
          TABNAS_LSP_GO_E2E: "0"
          TABNAS_LSP_RUST_E2E: "0"
        run: npm test

      # The registry is generated from fleet descriptors, so a stale
      # ts/data/registry.json means the checked-in routing table no
      # longer matches the descriptors it claims to derive from
      # (ADR-10: derive, never duplicate). Regenerating needs the
      # sibling repos, which CI does not clone, so this only asserts
      # the file parses and is non-empty — the drift gate belongs with
      # the fleet checkout the release job already has. The editors/
      # staleness gate, by contrast, needs only this repo and runs in
      # the suite (ts/test/geneditors.test.js).
      - name: Registry sanity
        shell: bash
        working-directory: lsp/ts
        run: >-
          node -e "const r=require('./data/registry.json');
          if(!Array.isArray(r.entries)||0===r.entries.length)
          {throw new Error('registry.json has no entries')}
          if(r.count!==r.entries.length)
          {throw new Error('registry.json count disagrees with entries')}
          console.log('registry ok: '+r.count+' entries')"

  ci-go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: lsp

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24"
          cache: false

      # Node too: this job owns the generator's Go end-to-end case,
      # which lives in the TypeScript suite (it generates a Go module,
      # then `go mod tidy && go build`s and runs it). The node job
      # suppresses that case so it cannot run against an unpinned
      # runner-image Go — which left it running in NO job at all while
      # still printing `ok`. Here it runs against the pinned 1.24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.x"

      - name: Clone the engine
        shell: bash
        run: git clone --depth 1 https://github.com/tabnas/parser.git parser

      # make go-work points the module at the sibling engine checkout
      # (a committed replace would break `go install` consumers), then
      # vets and runs the suite — including the cross-runtime
      # conformance fixtures that keep this port honest against the
      # canonical TS pipeline.
      - name: Test
        shell: bash
        working-directory: lsp
        run: |
          make build-go
          cd go && go vet ./... && go test ./...

      # The generator's Go end-to-end case, against the pinned Go above.
      # The engine must be built first: the generated Node/Go servers
      # resolve @tabnas/parser through the `file:../../parser/ts`
      # devDependency, exactly as the node job does.
      - name: Build the engine
        shell: bash
        working-directory: parser/ts
        run: npm i && npm run build

      - name: Generator end-to-end (Go target)
        shell: bash
        working-directory: lsp/ts
        env:
          TABNAS_LSP_RUST_E2E: "0"
        run: |
          npm i
          node --test test/generate.test.js

  # The Rust crate (rs/, the Rust port of the pipeline and the stdio
  # server) is gated the way the fleet's Rust ports are: everything lives
  # in ci/rust/run.sh so this file and a contributor's local run cannot
  # say different things. Its conformance suite runs the same
  # test/fixtures/lsp-conformance.json sections the node and Go jobs run,
  # which is what keeps the port honest against the canonical pipeline.
  ci-rust:
    runs-on: ubuntu-latest
    steps:
      # Checked out into a NAMED directory, like the other jobs:
      # rs/Cargo.toml takes the engine as `path = "../../parser/rs"`,
      # which resolves relative to rs/, so the engine has to sit beside
      # this checkout rather than inside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: lsp

      # Every path dependency of rs/Cargo.toml is a sibling checkout, and
      # cargo reads each one's manifest to resolve the graph whether or
      # not its feature is on. So the dialect compilers behind `dialects`
      # and the grammars behind `fleet` are cloned beside the engine,
      # together with the siblings THEY name (bnf under the compilers;
      # json, jsonic, hoover and xml under the grammars), which cargo
      # reads the same way. ci/rust/run.sh checks the manifest's list
      # before cargo runs, so a crate added there without a clone here
      # fails with the name of the missing checkout. One line per clone:
      # a transient task reports as it goes.
      - name: Clone the sibling crates
        shell: bash
        run: |
          SIBLINGS="parser bnf abnf ebnf gbnf json jsonic jsonc json5 jsonl csv ini hoover toml xml yaml zon feed"
          total=$(wc -w <<<"$SIBLINGS")
          n=0
          for s in $SIBLINGS; do
            n=$((n + 1))
            echo "clone: $s ($n of $total)"
            git clone --depth 1 --quiet "https://github.com/tabnas/$s.git" "$s"
          done

      # Pinned to the MSRV in rs/Cargo.toml rather than to `stable`, so
      # this fails on a change that needs a newer compiler instead of
      # passing here and breaking for anyone honouring rust-version.
      # rustup, NOT a third-party toolchain action: these repos allow only
      # GitHub-owned and verified-creator actions, so such an action is
      # refused before any job starts. The runners ship rustup.
      #
      # `default` is what makes the MSRV the toolchain the gate runs
      # under; installing it alone leaves cargo on the runner's
      # pre-installed stable.
      - name: Set up Rust MSRV
        shell: bash
        run: |
          rustup toolchain install 1.85 --profile minimal --component rustfmt,clippy
          rustup default 1.85

      - name: Rust gate
        shell: bash
        run: lsp/ci/rust/run.sh

      # The generator's Rust end-to-end case, against the MSRV above: it
      # generates a crate over this checkout's rs/ (a path in place of
      # the git dependency, as the Go case replaces go/), builds it with
      # cargo and drives it through the scripted LSP session. It lives in
      # the TypeScript suite, so Node comes too; only the generate-rust
      # tests run, and the Go case stays with ci-go.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.x"

      - name: Generator end-to-end (Rust target)
        shell: bash
        working-directory: lsp/ts
        env:
          TABNAS_LSP_GO_E2E: "0"
        run: |
          npm i
          node --test --test-name-pattern generate-rust test/generate.test.js
