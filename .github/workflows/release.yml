# Target: tabnas/lsp -> .github/workflows/release.yml
#
# Publishes @tabnas/lsp to npm via GitHub OIDC Trusted Publishing (no
# token), and writes the release tags. Two triggers:
#
#   workflow_dispatch  the normal path. Bump the versions first in a
#                      reviewed PR; this run reads what is already on
#                      main, publishes it, and tags it. The workflow
#                      never commits, so the bump stays a diff someone
#                      approved and the release stays a button.
#   push: ts/v*        the orchestrator path. admin/publish.sh pushes
#                      the tag itself, so the tag steps are no-ops and
#                      only the publish runs.
#
# WHY THE TAGGING LIVES IN THIS FILE, rather than a workflow of its own.
# npm allows exactly ONE workflow file per trusted publisher: the entry
# registered on npmjs.com names owner, repo and a single filename, and
# there is no second slot. Only that file can publish. So anything that
# must accompany a publish has to live inside it. An OIDC token from an
# unregistered workflow is rejected as:
#
#   npm error 404 Not Found - PUT https://registry.npmjs.org/@tabnas%2flsp
#
# — 404, not 403, so as not to leak whether a package exists. That reads
# as "no such package", which is nonsense, and costs an hour to the
# wrong hypothesis. Renaming this file breaks publishing until the
# npm-side entry is updated to match.
#
# TWO CREDENTIALS, AND NEITHER CAN DO THE OTHER'S JOB:
#
#   id-token: write   OIDC, exchanged for a short-lived credential AT
#                     NPM. Publishes. CANNOT create a tag — its audience
#                     is the registry, not GitHub.
#   contents: write   the per-run GITHUB_TOKEN. Writes tags.
#
# And they cannot be split across two workflows for a second reason: a
# ref pushed with GITHUB_TOKEN does NOT start another workflow run
# (GitHub suppresses that so workflows cannot trigger themselves). So
# "tag in workflow A, let the publisher fire on the tag" publishes
# nothing, silently.
#
# NO BUILD OR TEST STEP HERE, and that is deliberate for THIS repo — do
# not add one by analogy with other repos' release gates. lsp/ts carries
# `"@tabnas/parser": "file:../../parser/ts"` as a devDependency, and that
# sibling does not exist in a standalone checkout. `npm i` still EXITS 0
# — it creates node_modules/@tabnas/parser as a DANGLING SYMLINK — so a
# test step would `require` through a dead link and fail. The published
# tarball carries only bin/src/data/tools with the engine as an open
# peer, so the dangling dev link never reaches a consumer.
#
# What gates a release instead: ci.yml runs the full matrix on the PR
# that bumps the version. admin/publish.sh additionally verifies
# build+test locally against PUBLISHED deps before tagging, but does NOT
# require green CI first — that check is deferred to the end of its run
# ("CI is NOT waited on here", publish.sh step 4).
#
# Actions are pinned to full commit SHAs with the corresponding release
# as a trailing comment, on the lowest major whose `runs.using` is
# node24 (ADR-16). The SHA is the pin; the comment is documentation and
# is not what `rollout/apply-workflows.sh` compares.

name: release

on:
  workflow_dispatch:
    inputs:
      go:
        description: 'Also tag the Go module (go/v<version>)'
        type: boolean
        default: true
  push:
    tags:
      - 'ts/v*'

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC -> npm
      contents: write   # GITHUB_TOKEN -> tags
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0   # tags, for the already-released guard

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # lsp keeps ONE version across ts/package.json, the VERSION const
      # in ts/src/core.js and the VERSION const in go/lsp.go, gated by
      # version.test.js and version_test.go. package.json is the source.
      - name: Read the version
        id: v
        run: |
          V="$(node -p "require('./ts/package.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing $V"

      # A dispatch is NOT inherently tied to the default branch — the ref
      # is a parameter, so dispatching a version-bump feature branch would
      # publish an immutable npm version and immutable tags from an
      # unreviewed commit, bypassing the merged-main flow this header
      # promises. Refuse anything but main.
      - name: Refuse a dispatch from anywhere but main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::release must be dispatched from main (got ${{ github.ref }})"
          exit 1

      # Which tags this run still has to create. Fails closed only when
      # there is NOTHING left to do, which is the real "you forgot to
      # bump" signal; a run that has ts/v but is missing go/v is a
      # half-finished release and must be repairable, not refused.
      - name: Decide which tags this run must create
        id: tags
        if: github.event_name == 'workflow_dispatch'
        run: |
          V="${{ steps.v.outputs.version }}"
          MISSING=""
          git rev-parse -q --verify "refs/tags/ts/v$V" >/dev/null || MISSING="$MISSING ts/v$V"
          if [ "${{ inputs.go }}" = "true" ]; then
            git rev-parse -q --verify "refs/tags/go/v$V" >/dev/null || MISSING="$MISSING go/v$V"
          fi
          MISSING="$(echo $MISSING)"
          if [ -z "$MISSING" ]; then
            echo "::error::every tag this run would create already exists — bump the version first"
            exit 1
          fi
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "will create:$MISSING"

      # Fails OPEN, on purpose. The REGISTRY is the source of truth for
      # "is this released", not the tag: a run can publish and then fail
      # before tagging, leaving a version on npm with nothing pointing at
      # it. Without this check that state is unrecoverable, because the
      # publish step dies on "cannot publish over the previously
      # published versions" before ever reaching the tag steps.
      # Publishing only what is missing, and tagging either way, makes a
      # re-dispatch idempotent and able to reconcile a half-done release.
      - name: Publish to npm if the version is missing (OIDC)
        working-directory: ts
        run: |
          V="${{ steps.v.outputs.version }}"
          npm install -g npm@latest
          if npm view "@tabnas/lsp@$V" version >/dev/null 2>&1; then
            echo "@tabnas/lsp@$V is already on npm — skipping publish"
          else
            npm i
            npm run build --if-present
            npm publish --access public
          fi

      # Tagging runs AFTER publishing, so a tag only ever exists for a
      # release that actually reached the registry. A failed publish
      # writes no tag and the dispatch can simply be re-run.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The Go module has no registry upload step: proxy.golang.org
          # serves whatever the tag points at, so PUSHING THE TAG IS THE
          # RELEASE, and it cannot be undone — the proxy caches module
          # versions immutably. A go/vX.Y.Z that names the wrong commit
          # is permanent; bump to the next patch rather than trying to
          # move it.
          #
          # ONE atomic transaction, not a push per tag. Pushed separately,
          # ts/v could land and go/v fail on a transient error, leaving
          # npm published, ts/v tagged and the Go module unreleased — and
          # the guard above would then refuse every re-dispatch, so the
          # half-release could never be repaired. --atomic makes it
          # both-or-neither: neither is recoverable, both is done.
          for T in ${{ steps.tags.outputs.missing }}; do
            git tag "$T"
          done
          git push --atomic origin ${{ steps.tags.outputs.missing }}
