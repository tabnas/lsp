# The parts of Google's word list that are right for this project,
# carried as our own rule so they can sit at error level.
#
# Google.WordListCase itself is a WARNING here. Its list is written for
# product UI, and several of its swaps misread technical prose: `touch`
# to `tap`, `above` to `preceding`, `regex` to "regular expression".
# .vale.ini records what it reports on these pages and why.
#
# The swap carried here is its `file name` to `filename`, which collides
# with nothing on these pages.
extends: substitution
message: "Use '%s' instead of '%s'."
link: 'https://developers.google.com/style/word-list'
level: error
ignorecase: true
action:
  name: replace
swap:
  file name: filename
  file names: filenames
